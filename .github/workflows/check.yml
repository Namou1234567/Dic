name: Dictionary checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  dictionary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check vocabulary and clip ranges
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          node tests/vocabulary.cjs
      - name: Check desktop and mobile pronunciation and the update banner
        run: |
          npm install --no-save --package-lock=false playwright@1.65.1
          npx playwright install --with-deps chromium webkit
          python3 -m http.server 8765 --bind 127.0.0.1 &
          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:8765/ -o /dev/null; then break; fi
            sleep 1
          done
          node tests/study-audio.cjs
          node tests/mobile-audio.cjs
          node tests/update-banner.cjs
