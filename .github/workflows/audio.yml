name: Generate missing audio

# Synthesizes recordings for vocabulary entries that have no audio yet, using the
# same voices as the existing clips, and commits the new banks and manifests back
# to the branch. Runs on pushes to non-main branches that change vocabulary.js or the
# generator, or manually from the Actions tab.
on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths: [vocabulary.js, tools/generate_audio.py]

permissions:
  contents: write

concurrency:
  group: audio-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FFmpeg and speech tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install numpy edge-tts
      - name: Generate missing clips
        run: python3 tools/generate_audio.py
      - name: Check vocabulary and clip ranges
        run: node tests/vocabulary.cjs
      - name: Commit new audio
        run: |
          git add audio
          if git diff --cached --quiet; then
            echo "No new audio."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update vocabulary recordings"
          git push
